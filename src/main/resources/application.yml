spring:
  application:
    name: reservation-system

  datasource:
    url: jdbc:postgresql://localhost:5432/reservation_db
    username: postgres
    password: postgres

    logging:
      level:
        org.springframework.jdbc: DEBUG

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080